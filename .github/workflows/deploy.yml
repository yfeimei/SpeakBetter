name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; cancel a superseded run rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit and render tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Set these as repository variables under
          # Settings -> Secrets and variables -> Actions -> Variables.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}

      - name: Upload build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
